# exp only: dSYM of a ThinLTO Release mudlet with and without -object_path_lto (vadi2 fork)
name: exp-mac-dsym
on:
  push:
    branches: ['exp/mac-dsym']

permissions:
  contents: read

jobs:
  compile-mudlet:
    name: ${{matrix.buildname}}
    runs-on: ${{matrix.os}}
    env:
      LUA_VERSION: '5.1.5'
      CCACHE_MAXSIZE: ${{ matrix.ccache_maxsize || '500M' }}
      CCACHE_COMPRESSLEVEL: ${{ (github.ref_name == 'development' && github.event_name != 'schedule' && github.event.inputs.scheduled != 'true') && '19' || '1' }}
      # macOS and Linux releases are built profile-guided - see cmake/ProfileGuidedOptimization.cmake -
      # and so are macOS PTBs, at their own build type, so a broken profile-guided build shows up the
      # next morning rather than on release day. Linux PTBs are AddressSanitizer builds instead, so
      # only a tag or a manual pgo run builds Linux profile-guided.
      MUDLET_PGO_BUILD: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Homebrew no longer bottles for Intel: this job pours the Sonoma bottles the image's frozen Homebrew still
          # names (HOMEBREW_NO_AUTO_UPDATE), and uses the pcre2, sqlite, libzip and oniguruma the image preinstalls.
          # No tests: only the getOS processor spec branches on host architecture, and the Linux and Windows jobs run
          # it on x86_64, so the arm64 job covers the rest on a faster pool.
          - os: macos-15-intel
            buildname: 'macos (x86_64)'
            compiler: clang_64
            qt: '6.11.3'
            ccache_id: macos-x64
            deploy: 'deploy'
            build_tests: 'false'
            pgo: 'true'
          # macOS 15, not 26: bundled Homebrew libraries carry the minos of the macOS they were bottled for
          # (15.0 here, 26.0 on macos-26), whatever CMAKE_OSX_DEPLOYMENT_TARGET says.
          - os: macos-15
            buildname: 'macos (arm64) / c++, lua tests'
            compiler: clang_64
            qt: '6.11.3'
            ccache_id: macos-arm64
            deploy: 'deploy'
            run_tests: 'true'
            pgo: 'true'

    steps:
    - name: Checkout Mudlet source code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{matrix.qt}}
        dir: ${{runner.workspace}}
        # Deliberately uncached: the Qt tree is 335MB on Linux and 389MB on macOS,
        # and a copy per runner image, module set and ref took over 40% of the
        # repository's 10GB cache quota - more than every ccache put together.
        # Fetching it afresh costs 25-35s a job. Leaving it cached cost far more
        # than that, because a quota with no headroom has GitHub evicting by
        # least-recently-used, and a dropped ccache is a 20 minute cold rebuild
        # rather than a 30 second download.
        cache: false
        modules: qt5compat qtmultimedia qtspeech qtwebsockets qthttpserver

    - name: Restore Lua build cache
      id: cache-lua
      uses: actions/cache/restore@v6
      with:
        path: .lua
        # Not gh-actions-lua's own buildCache: that shares one key across
        # runner images, and a .lua built on ubuntu-latest cannot run on
        # ubuntu-22.04 (newer glibc). The action skips its lua.org download
        # whenever .lua already exists.
        key: lua-${{ env.LUA_VERSION }}-${{ matrix.os }}-${{ runner.arch }}

    - name: (macOS) Install Lua via GitHub Actions
      if: runner.os == 'macOS'
      uses: leafo/gh-actions-lua@v13
      with:
        luaVersion: ${{ env.LUA_VERSION }}
        buildCache: false

    - name: (macOS) Install Luarocks via GitHub Actions
      if: runner.os == 'macOS'
      uses: leafo/gh-actions-luarocks@v6

    # Keyed on the runner image, as the rocks link against its Homebrew libraries, and on
    # the script that installs them. A tagged release installs its rocks afresh, since the
    # app bundles them. As with ccache, saves are keyed per run and restores prefix-match
    # the newest, so a set that fails its check is replaced rather than restored for good.
    - name: (macOS) Work out the Lua rocks cache key
      if: runner.os == 'macOS'
      id: rocks
      run: |
        echo "prefix=luarocks-${{ matrix.os }}-${{ runner.arch }}-${ImageVersion:?is not set}-${{ hashFiles('CI/install-lua-rocks.sh') }}-" >> "$GITHUB_OUTPUT"

    - name: (macOS) Restore Lua rocks cache
      if: runner.os == 'macOS' && !startsWith(github.ref, 'refs/tags/')
      id: cache-luarocks
      uses: actions/cache/restore@v6
      with:
        path: ~/.luarocks
        key: ${{ steps.rocks.outputs.prefix }}
        restore-keys: ${{ steps.rocks.outputs.prefix }}

    - name: (macOS) Install dependencies
      if: runner.os == 'macOS'
      env:
        HOMEBREW_NO_ANALYTICS: "ON"
        HOMEBREW_NO_AUTO_UPDATE: "ON"
        HOMEBREW_NO_BOTTLE_SOURCE_FALLBACK: "ON"
        HOMEBREW_NO_INSTALL_CLEANUP: "ON"
      timeout-minutes: 7
      run: |
        # Remove Homebrew LLVM to prevent it from shadowing AppleClang.
        # Upstream LLVM can't compile Objective-C++ against Apple SDK headers.
        brew uninstall --ignore-dependencies llvm@15 2>/dev/null || true

        # Install all required dependencies
        # brew install can hang indefinitely during bottle pouring, so timeout and retry
        for attempt in 1 2 3; do
          brew install libzzip libzip ccache assimp hunspell oniguruma pcre2 pugixml sqlite yajl boost &
          brew_pid=$!
          ( sleep 120 && kill $brew_pid 2>/dev/null ) &
          watcher_pid=$!
          wait $brew_pid && { kill $watcher_pid 2>/dev/null || true; wait $watcher_pid 2>/dev/null || true; break; }
          kill $watcher_pid 2>/dev/null || true; wait $watcher_pid 2>/dev/null || true
          echo "::warning::brew install attempt $attempt failed or timed out, retrying..."
          if [ "$attempt" -eq 3 ]; then
            echo "::error::brew install failed after 3 attempts"
            exit 1
          fi
        done

        echo "CCACHE_DIR=${{runner.workspace}}/ccache" >> $GITHUB_ENV

        # Use latest available XCode
        echo "DEVELOPER_DIR=$(xcode-select --print-path)" >> $GITHUB_ENV
        echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> $GITHUB_ENV

        # Detect Homebrew prefix once (differs between x86_64 and ARM64)
        if [ "$(uname -m)" = "arm64" ]; then
          HOMEBREW_PREFIX=/opt/homebrew
        else
          HOMEBREW_PREFIX=/usr/local
        fi
        echo "HOMEBREW_PREFIX=$HOMEBREW_PREFIX" >> $GITHUB_ENV

        # Set CMAKE_PREFIX_PATH to include both Qt and Homebrew directories
        # Qt is installed by install-qt-action, Homebrew has qtkeychain
        # Use : as separator (Unix) not ; (Windows)
        echo "CMAKE_PREFIX_PATH=${QT_ROOT_DIR}:${HOMEBREW_PREFIX}" >> $GITHUB_ENV

        # Help CMake find Lua installed by gh-actions-lua
        # The action installs to .lua/ and .luarocks/ in the runner home
        echo "LUA_DIR=$HOME/.lua" >> $GITHUB_ENV

        # Help CMake find keg-only Homebrew packages (PCRE2 is keg-only on macOS)
        echo "PKG_CONFIG_PATH=${HOMEBREW_PREFIX}/opt/pcre2/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

        # Install lua-yajl early to generate translation statistics - unless the cache held
        # every rock, and they all still load against this runner's Homebrew libraries
        if [ -n "${{ steps.cache-luarocks.outputs.cache-matched-key }}" ] \
          && ${{github.workspace}}/CI/install-lua-rocks.sh --check; then
          echo "LUA_ROCKS_CACHED=true" >> $GITHUB_ENV
        else
          HOMEBREW_PREFIX="${HOMEBREW_PREFIX}" ${{github.workspace}}/CI/install-lua-rocks.sh lua-yajl
        fi

        # Allow stats generation script to see location of lua-yajl
        eval "$(luarocks path --local --lua-version "5.1")"
        echo "LUA_PATH=$LUA_PATH" >> $GITHUB_ENV
        echo "LUA_CPATH=$LUA_CPATH" >> $GITHUB_ENV

    - name: (Linux) Install Lua via GitHub Actions
      uses: leafo/gh-actions-lua@v13
      if: runner.os == 'Linux'
      with:
        luaVersion: ${{ env.LUA_VERSION }}
        buildCache: false

    - name: (Linux) Install Luarocks via GitHub Actions
      uses: leafo/gh-actions-luarocks@v6
      if: runner.os == 'Linux'

    - name: Save Lua build cache
      if: github.ref_name == 'development' && steps.cache-lua.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .lua
        key: lua-${{ env.LUA_VERSION }}-${{ matrix.os }}-${{ runner.arch }}

    - name: (Linux) Install dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update

        # Install all required dependencies
        # liblua5.1-0-dev is needed for CMake to find Lua headers/library
        sudo apt-get install \
          ccache \
          g++-${{matrix.gcc_compiler_version}} \
          libassimp-dev \
          libboost-dev \
          libcurl4-openssl-dev \
          libglu1-mesa-dev \
          libhunspell-dev \
          liblua5.1-0-dev \
          libonig-dev \
          libpcre2-dev \
          libpulse-dev \
          libpugixml-dev \
          libsecret-1-dev \
          libspeechd-dev \
          libsqlite3-dev \
          libssl-dev \
          libxkbcommon-x11-0 \
          libxcb-render-util0-dev \
          libxcb-image0-dev \
          libyajl-dev \
          libzip-dev \
          qtkeychain-qt6-dev \
          pcre2-utils \
          pkg-config \
          openssl \
          ca-certificates \
          -y

        # switch to GCC that supports C++20 while retaining support for older OS's
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{matrix.gcc_compiler_version}} ${{matrix.gcc_compiler_version}}
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{matrix.gcc_compiler_version}} ${{matrix.gcc_compiler_version}}
        sudo update-alternatives --set gcc /usr/bin/gcc-${{matrix.gcc_compiler_version}}
        sudo update-alternatives --set g++ /usr/bin/g++-${{matrix.gcc_compiler_version}}

        echo "CCACHE_DIR=${{runner.workspace}}/ccache" >> $GITHUB_ENV

        # Install lua-yajl early to generate translation statistics
        ${{github.workspace}}/CI/install-lua-rocks.sh lua-yajl

        # Allow stats generation script to see location of lua-yajl
        eval "$(luarocks path --local --lua-version "5.1")"
        echo "LUA_PATH=$LUA_PATH" >> $GITHUB_ENV
        echo "LUA_CPATH=$LUA_CPATH" >> $GITHUB_ENV

    - name: (Linux) Restore xcb-util-cursor 0.1.6 cache
      id: cache-xcb-cursor
      if: runner.os == 'Linux'
      uses: actions/cache/restore@v6
      with:
        path: ${{runner.workspace}}/xcb-util-cursor-stage
        key: xcb-util-cursor-0.1.6-${{matrix.os}}-${{runner.arch}}

    - name: (Linux) Build xcb-util-cursor 0.1.6
      timeout-minutes: 5
      if: runner.os == 'Linux' && steps.cache-xcb-cursor.outputs.cache-hit != 'true'
      run: |
        # This version fixes the off-by-one heap buffer overflow in _XcursorThemeInherits
        # that causes PTB builds to crash with AddressSanitizer
        # Several mirrors, each retried: xorg.freedesktop.org served an expired
        # TLS certificate on 2026-07-28, breaking every CI run
        for url in \
          https://xorg.freedesktop.org/archive/individual/lib/xcb-util-cursor-0.1.6.tar.xz \
          https://www.x.org/releases/individual/lib/xcb-util-cursor-0.1.6.tar.xz \
          https://xcb.freedesktop.org/dist/xcb-util-cursor-0.1.6.tar.xz
        do
          for attempt in 1 2 3; do
            if wget -q --connect-timeout=10 --read-timeout=30 --tries=3 --waitretry=5 -O xcb-util-cursor-0.1.6.tar.xz "$url"; then
              break 2
            fi
            echo "::warning::download attempt $attempt from $url failed, retrying..."
            sleep $((attempt * 5))
          done
        done
        # Checksum from https://lists.x.org/archives/xorg-announce/2025-September/003625.html
        # also fails the step if every mirror was unreachable
        echo "fdeb8bd127873519be5cc70dcd0d3b5d33b667877200f9925a59fdcad8f7a933  xcb-util-cursor-0.1.6.tar.xz" | sha256sum -c
        tar xf xcb-util-cursor-0.1.6.tar.xz
        cd xcb-util-cursor-0.1.6

        # Configure and build
        ./configure --prefix=/usr --libdir=/usr/lib/x86_64-linux-gnu
        make -j$(nproc)

        # staged rather than installed directly: the install step below copies
        # from this tree whether it was built here or restored from the cache
        make DESTDIR="${{runner.workspace}}/xcb-util-cursor-stage" install

    - name: (Linux) Save xcb-util-cursor 0.1.6 cache
      if: >-
        runner.os == 'Linux' && github.ref_name == 'development'
        && steps.cache-xcb-cursor.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{runner.workspace}}/xcb-util-cursor-stage
        key: xcb-util-cursor-0.1.6-${{matrix.os}}-${{runner.arch}}

    - name: (Linux) Install xcb-util-cursor 0.1.6
      if: runner.os == 'Linux'
      run: |
        # Install system-wide (replaces Ubuntu 22.04's buggy 0.1.1)
        sudo cp -a "${{runner.workspace}}/xcb-util-cursor-stage/." /

        # Update library cache so linker finds new version
        sudo ldconfig

    - name: (Linux) Install mold linker
      timeout-minutes: 5
      if: runner.os == 'Linux'
      env:
        MOLD_VERSION: '3.0.0'
        # mold publishes no checksum manifest, so this is the hash of the
        # pinned asset as downloaded - re-verify it by hand when bumping
        MOLD_SHA256: '6c90d4a474c7c0409dfb575be03a5345878ac14fdba18de8b40fa58c60121189'
      run: |
        # Ubuntu 22.04 only packages mold 1.0.3, so take it from upstream
        curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 120 -o mold.tar.gz \
          "https://github.com/rui314/mold/releases/download/v${MOLD_VERSION}/mold-${MOLD_VERSION}-x86_64-linux.tar.gz"
        echo "${MOLD_SHA256}  mold.tar.gz" | sha256sum -c
        sudo tar xf mold.tar.gz -C /usr/local --strip-components=1
        rm mold.tar.gz
        # not bin/mold: this is the GNU ld drop-in that -B has to resolve to
        /usr/local/libexec/mold/ld --version

    - name: (Linux Clang) change compiler & disable optional components
      if: runner.os == 'Linux' && matrix.compiler == 'clang_64'
      run: |
         echo "CXX=clang++" >> $GITHUB_ENV
         echo "CC=clang" >> $GITHUB_ENV
         echo "WITH_UPDATER=no" >> $GITHUB_ENV
         echo "WITH_3DMAPPER=no" >> $GITHUB_ENV
         echo "WITH_FONTS=no" >> $GITHUB_ENV
         # The one job that builds without precompiled headers, so a missing #include still fails somewhere
         echo "CMAKE_DISABLE_PRECOMPILE_HEADERS=ON" >> $GITHUB_ENV

    # Saves are keyed per commit, so the primary key deliberately matches no entry
    # and every restore prefix-matches the newest. A profile-guided build skips it:
    # the profile flags are on every object it compiles, so nothing in the cache matches.
    - name: Restore ccache
      if: env.MUDLET_PGO_BUILD != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{runner.workspace}}/ccache
        key: ccache-${{ matrix.ccache_id }}-sha-
        restore-keys: ccache-${{ matrix.ccache_id }}-sha-

    - name: (Linux) Set build info
      if: runner.os == 'Linux'
      env:
        GITHUB_EVENT_INPUTS_SCHEDULED: ${{inputs.scheduled}}
      run: |
        ${{github.workspace}}/CI/validate_deployment.sh
        ${{github.workspace}}/CI/set-build-info.sh

    - name: (macOS) Set build info
      if: runner.os == 'macOS'
      env:
        GITHUB_EVENT_INPUTS_SCHEDULED: ${{inputs.scheduled}}
      run: |
        ${{github.workspace}}/CI/validate_deployment.sh
        ${{github.workspace}}/CI/set-build-info.sh
        # ccache can't reliably detect that the compiler is clang on macOS, so just say so explicitly.
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV

    - name: check ccache stats prior to build
      run: |
        ccache --zero-stats --show-stats -v
        ccache --show-compression

    - name: recompress the restored ccache
      if: >-
        github.ref_name == 'development'
        && github.event_name != 'schedule' && github.event.inputs.scheduled != 'true'
      run: |
        ccache --recompress 19
        ccache --show-compression
        echo "CCACHE_BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

    # A profile-guided build (releases, macOS PTBs and manual pgo runs) builds only the instrumented benchmarks
    # CI/pgo-train.sh trains on here - it needs the test tree even where the job ships
    # without one. Building mudlet in this pass would send the instrumented
    # binary's debug files to Sentry.
    - name: Build Mudlet
      uses: lukka/run-cmake@v10.9
      with:
        configurePreset: ${{ runner.os == 'macOS' && ((matrix.build_tests == 'false' && env.MUDLET_PGO_BUILD != 'true') && 'ci-macos-no-tests' || 'ci-macos') || 'ci-linux' }}
        buildPreset: ${{ runner.os == 'macOS' && ((matrix.build_tests == 'false' && env.MUDLET_PGO_BUILD != 'true') && 'ci-macos-no-tests' || 'ci-macos') || 'ci-linux' }}
        buildPresetAdditionalArgs: "['--target', 'mudlet_executable']"
        # CMake's IPO is ThinLTO on Clang: full LTO ran no faster and its links swapped on the runners.
        # Each test binary links all of Mudlet, so -cache_path_lto reuses the code generation they share.
        configurePresetAdditionalArgs: ${{ runner.os == 'macOS' && env.MUDLET_PGO_BUILD == 'true' && '[''-DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON'', ''-DCMAKE_EXE_LINKER_FLAGS=-Wl,-cache_path_lto,lto-cache'']' || '[]' }}
      env:
        NINJA_STATUS: '[%f/%t %o/sec] '
        # The run-varying half of the ci-linux/ci-macos presets - everything else
        # about the configuration lives in CMakePresets.json
        CMAKE_BUILD_TYPE: 'Release'
        MUDLET_PGO: ''
        USE_SANITIZER: ${{ matrix.enable_asan == 'true' && !startsWith(github.ref, 'refs/tags/Mudlet-') && github.event.inputs.pgo != 'true' && 'Address' || '' }}
        WITH_SENTRY: 'ON'
        SENTRY_SEND_DEBUG: '1'
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        MUDLET_SANITIZERS: ${{ github.event_name == 'pull_request' && 'address' || '' }}
        SENTRY_AUTH_TOKEN: 'exp-dummy'
        # An environment variable rather than a -D: CMake reads this one through
        # include_optional_module(), which only ever consults the environment.
        WITH_MCPSERVER: "ON"

    - name: exp collect
      if: always()
      run: ${{github.workspace}}/.github/exp-dsym/collect.sh ${{runner.workspace}}/b/ninja ${{runner.temp}}/exp-out

    - name: exp upload
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: exp-dsym-${{ runner.arch }}
        path: ${{runner.temp}}/exp-out
