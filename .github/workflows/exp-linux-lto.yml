# EXPERIMENT ONLY (vadi2/Mudlet exp/linux-* branches): the Linux release job of build-mudlet.yml
# (ubuntu-22.04, Qt 6.11.3, Release, PGO GENERATE -> pgo-train.sh -> USE with tests, Sentry -g,
# ctest, AppImage, Lua tests) once per variant, with the toolchain/LTO/layout knobs varied.
name: exp linux lto
on:
  push:
    branches: ['exp/linux-*']

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.v.outputs.variants }}
    steps:
    - uses: actions/checkout@v7
    - id: v
      # each entry: {name, cc (gcc|clang), ver, ipo (ON|OFF), args, pad, tests}
      run: echo "variants=$(jq -c . .github/exp/linux-variants.json)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.v.name }}
    needs: setup
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        v: ${{ fromJSON(needs.setup.outputs.variants) }}
    env:
      LUA_VERSION: '5.1.5'
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESSLEVEL: '1'
      MUDLET_PGO_BUILD: 'true'
      NINJA_STATUS: '[%f/%t %o/sec] '

    steps:
    - name: Checkout Mudlet source code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Start the memory sampler
      run: |
        nohup bash -c 'while true; do
          echo "$(date +%s) $(awk "/^MemAvailable:/{a=\$2} /^SwapFree:/{s=\$2} /^SwapTotal:/{t=\$2} END{print a, t-s}" /proc/meminfo) $(ps -eo rss=,comm= --sort=-rss | head -4 | awk "{printf \"%s:%d \", \$2, \$1}")"
          sleep 5
        done' > "${RUNNER_TEMP}/mem.log" 2>&1 &
        echo "EXP_T0=$(date +%s)" >> "$GITHUB_ENV"
        nproc; free -m; df -h /

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.3'
        dir: ${{runner.workspace}}
        cache: false
        modules: qt5compat qtmultimedia qtspeech qtwebsockets qthttpserver

    - name: (Linux) Install Lua via GitHub Actions
      uses: leafo/gh-actions-lua@v13
      with:
        luaVersion: ${{ env.LUA_VERSION }}
        buildCache: false

    - name: (Linux) Install Luarocks via GitHub Actions
      uses: leafo/gh-actions-luarocks@v6

    - name: (Linux) Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install \
          ccache \
          g++-12 \
          libassimp-dev \
          libboost-dev \
          libcurl4-openssl-dev \
          libglu1-mesa-dev \
          libhunspell-dev \
          liblua5.1-0-dev \
          libonig-dev \
          libpcre2-dev \
          libpulse-dev \
          libpugixml-dev \
          libsecret-1-dev \
          libspeechd-dev \
          libsqlite3-dev \
          libssl-dev \
          libxkbcommon-x11-0 \
          libxcb-render-util0-dev \
          libxcb-image0-dev \
          libyajl-dev \
          libzip-dev \
          qtkeychain-qt6-dev \
          pcre2-utils \
          pkg-config \
          openssl \
          ca-certificates \
          -y

        GCCV=12
        if [ "${{ matrix.v.cc }}" = "gcc" ]; then GCCV=${{ matrix.v.ver }}; fi
        if [ "${GCCV}" -gt 12 ]; then
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y g++-${GCCV}
        fi
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${GCCV} ${GCCV}
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${GCCV} ${GCCV}
        sudo update-alternatives --set gcc /usr/bin/gcc-${GCCV}
        sudo update-alternatives --set g++ /usr/bin/g++-${GCCV}

        if [ "${{ matrix.v.cc }}" = "clang" ]; then
          V=${{ matrix.v.ver }}
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${V} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-${V} lld-${V} llvm-${V}
          # CMake's USE_ALTERNATE_LINKER looks for ld.lld on PATH
          sudo ln -sf /usr/lib/llvm-${V}/bin/ld.lld /usr/local/bin/ld.lld
          echo "CC=clang-${V}" >> $GITHUB_ENV
          echo "CXX=clang++-${V}" >> $GITHUB_ENV
          echo "LLVM_PROFDATA=/usr/lib/llvm-${V}/bin/llvm-profdata" >> $GITHUB_ENV
          clang++-${V} -v -E -x c++ /dev/null -o /dev/null 2>&1 | grep -iE 'version|gcc installation|^ /usr' | head -20
        fi
        g++ --version | head -1
        ls /usr/lib/gcc/x86_64-linux-gnu/

        echo "CCACHE_DIR=${{runner.workspace}}/ccache" >> $GITHUB_ENV
        ${{github.workspace}}/CI/install-lua-rocks.sh lua-yajl
        eval "$(luarocks path --local --lua-version "5.1")"
        echo "LUA_PATH=$LUA_PATH" >> $GITHUB_ENV
        echo "LUA_CPATH=$LUA_CPATH" >> $GITHUB_ENV

    - name: (Linux) Build xcb-util-cursor 0.1.6
      timeout-minutes: 5
      run: |
        for url in \
          https://xorg.freedesktop.org/archive/individual/lib/xcb-util-cursor-0.1.6.tar.xz \
          https://www.x.org/releases/individual/lib/xcb-util-cursor-0.1.6.tar.xz \
          https://xcb.freedesktop.org/dist/xcb-util-cursor-0.1.6.tar.xz
        do
          for attempt in 1 2 3; do
            if wget -q --connect-timeout=10 --read-timeout=30 --tries=3 --waitretry=5 -O xcb-util-cursor-0.1.6.tar.xz "$url"; then
              break 2
            fi
            sleep $((attempt * 5))
          done
        done
        echo "fdeb8bd127873519be5cc70dcd0d3b5d33b667877200f9925a59fdcad8f7a933  xcb-util-cursor-0.1.6.tar.xz" | sha256sum -c
        tar xf xcb-util-cursor-0.1.6.tar.xz
        cd xcb-util-cursor-0.1.6
        ./configure --prefix=/usr --libdir=/usr/lib/x86_64-linux-gnu
        make -j$(nproc)
        make DESTDIR="${{runner.workspace}}/xcb-util-cursor-stage" install
        sudo cp -a "${{runner.workspace}}/xcb-util-cursor-stage/." /
        sudo ldconfig

    - name: (Linux) Install mold linker
      timeout-minutes: 5
      env:
        MOLD_VERSION: '3.0.0'
        MOLD_SHA256: '6c90d4a474c7c0409dfb575be03a5345878ac14fdba18de8b40fa58c60121189'
      run: |
        curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 120 -o mold.tar.gz \
          "https://github.com/rui314/mold/releases/download/v${MOLD_VERSION}/mold-${MOLD_VERSION}-x86_64-linux.tar.gz"
        echo "${MOLD_SHA256}  mold.tar.gz" | sha256sum -c
        sudo tar xf mold.tar.gz -C /usr/local --strip-components=1
        rm mold.tar.gz
        /usr/local/libexec/mold/ld --version

    - name: (Linux) Set build info
      run: |
        ${{github.workspace}}/CI/validate_deployment.sh
        ${{github.workspace}}/CI/set-build-info.sh

    - name: Build Mudlet (instrumented benchmarks)
      env:
        CMAKE_BUILD_TYPE: Release
        MUDLET_PGO: GENERATE
        USE_SANITIZER: ''
        WITH_SENTRY: 'ON'
        SENTRY_SEND_DEBUG: '1'
        SENTRY_DSN: ''
        SENTRY_AUTH_TOKEN: 'exp-dry-run'
        WITH_MCPSERVER: "ON"
      run: |
        echo "EXP_T_BUILD0=$(date +%s)" >> "$GITHUB_ENV"
        cmake --preset ci-linux -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=${{ matrix.v.ipo }} -DMUDLET_LAYOUT_PAD=${{ matrix.v.pad }} ${{ matrix.v.args }}
        cmake --build --preset ci-linux --target PipelineBenchmark MapRenderBenchmark PathfindBenchmark
        echo "EXP_T_GEN1=$(date +%s)" >> "$GITHUB_ENV"

    - name: install dependencies for packaging/tests
      run: |
        ${{github.workspace}}/CI/install-lua-rocks.sh
        sudo apt-get install libgstreamer-plugins-base1.0-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 xvfb libfuse2 -y

    - name: Train, then do the profile-guided build
      env:
        SENTRY_AUTH_TOKEN: 'exp-dry-run'
        EXP_SENTRY_DRYRUN: '1'
      run: |
        set -o pipefail
        echo "EXP_T_TRAIN0=$(date +%s)" >> "$GITHUB_ENV"
        ${{github.workspace}}/CI/pgo-train.sh ${{runner.workspace}}/b/ninja
        echo "EXP_T_USE0=$(date +%s)" >> "$GITHUB_ENV"
        cmake -B ${{runner.workspace}}/b/ninja -DMUDLET_PGO=USE -DBUILD_TESTING=${{ matrix.v.tests == 'true' && 'ON' || 'OFF' }}
        cmake --build ${{runner.workspace}}/b/ninja 2>&1 | tee "${RUNNER_TEMP}/use-build.log"
        echo "EXP_T_USE1=$(date +%s)" >> "$GITHUB_ENV"

    - name: (Linux) Run C++ tests
      if: matrix.v.tests == 'true'
      continue-on-error: true
      working-directory: '${{runner.workspace}}/b/ninja'
      run: |
        set -o pipefail
        ctest --output-on-failure -j $(nproc) 2>&1 | tee "${RUNNER_TEMP}/ctest.log"
      env:
        QT_QPA_PLATFORM: offscreen
        MUDLET_MEDIA_TESTS_REQUIRE_PLAYBACK: 1
        MUDLET_TEST_REQUIRE_DBUS: 1

    - name: package Mudlet
      run: |
        export ARCH=$(uname -m)
        echo "ARCH=$ARCH" >> $GITHUB_ENV
        # after_success.sh only packages in Mudlet/Mudlet; the Linux half is what it would run
        cd ${{github.workspace}}
        bash CI/linux.after_success.sh
      env:
        BUILD_FOLDER: ${{runner.workspace}}/b/ninja
        RUNNER_OS: ${{runner.os}}
        DEPLOY: 'deploy'
        WITH_SENTRY: "ON"
        GITHUB_FORCE_BUILD: 'false'
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload packaged Mudlet
      uses: actions/upload-artifact@v7
      if: env.UPLOAD_FILENAME
      with:
        name: appimage-${{ matrix.v.name }}
        path: ${{env.FOLDER_TO_UPLOAD}}
        retention-days: 7

    - name: Collect diagnostics
      if: always()
      run: |
        B=${{runner.workspace}}/b/ninja
        D=${RUNNER_TEMP}/diag
        mkdir -p "$D"
        T_END=$(date +%s)
        {
          echo "variant ${{ matrix.v.name }} cc=${{ matrix.v.cc }} ver=${{ matrix.v.ver }} ipo=${{ matrix.v.ipo }} pad=${{ matrix.v.pad }} tests=${{ matrix.v.tests }} args=${{ matrix.v.args }}"
          echo "sha $(git -C ${{github.workspace}} rev-parse HEAD)"
          echo "t_gen_build_s $(( ${EXP_T_GEN1:-0} - ${EXP_T_BUILD0:-0} ))"
          echo "t_train_s $(( ${EXP_T_USE0:-0} - ${EXP_T_TRAIN0:-0} ))"
          echo "t_use_build_s $(( ${EXP_T_USE1:-0} - ${EXP_T_USE0:-0} ))"
          echo "t_job_so_far_s $(( T_END - EXP_T0 ))"
          awk 'NR==1{min=$2} $2<min{min=$2; at=$0} {if($3>maxswap)maxswap=$3} END{printf "min_mem_available_mb %d\nmax_swap_used_mb %d\nat %s\n", min/1024, maxswap/1024, at}' "${RUNNER_TEMP}/mem.log"
          echo "peak rss per process name (MB):"
          awk '{for(i=4;i<=NF;i++){split($i,a,":"); if(a[2]>m[a[1]])m[a[1]]=a[2]}} END{for(k in m) printf "  %s %d\n", k, m[k]/1024}' "${RUNNER_TEMP}/mem.log" | sort -k2 -n -r | head -12
          grep -E 'CMAKE_INTERPROCEDURAL_OPTIMIZATION|CMAKE_CXX_COMPILER:|CMAKE_C_COMPILER:|CMAKE_AR:|CMAKE_CXX_COMPILER_AR|CMAKE_RANLIB|USE_ALTERNATE_LINKER|MUDLET_PGO|MUDLET_LAYOUT_PAD|BUILD_TESTING|SENTRY_SEND_DEBUG|WITH_SENTRY|CMAKE_BUILD_TYPE|CMAKE_EXE_LINKER_FLAGS:|CMAKE_CXX_FLAGS:' "$B/CMakeCache.txt"
          echo "use-build warnings:"
          grep -c 'coverage mismatch\|profile.*mismatch\|-Wcoverage-mismatch' "${RUNNER_TEMP}/use-build.log" || true
          grep -c 'warning:' "${RUNNER_TEMP}/use-build.log" || true
          grep -m5 -i 'mismatch\|missing-profile\|out-of-date\|profile-instr' "${RUNNER_TEMP}/use-build.log" || true
          echo "ctest:"; grep -E 'tests passed|tests failed|Total Test time' "${RUNNER_TEMP}/ctest.log" 2>/dev/null || echo "not run"
          echo "mudlet: $(ls -l $B/src/mudlet 2>/dev/null)"
          echo "glibcxx max: $(objdump -T $B/src/mudlet 2>/dev/null | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -1)"
          echo "glibc max: $(objdump -T $B/src/mudlet 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "libasan: $(ldd $B/src/mudlet 2>/dev/null | grep -c asan)"
          readelf -p .comment $B/src/mudlet 2>/dev/null | head -8
          df -h / | tail -1
        } > "$D/summary.txt" 2>&1
        cat "$D/summary.txt"
        cp "${RUNNER_TEMP}/mem.log" "$D/" || true
        cp "$B/.ninja_log" "$D/ninja_log.txt" || true
        cp "$B/CMakeCache.txt" "$D/" || true
        cp "$B/src/mudlet.map" "$D/" || true
        nm -n --defined-only $B/src/mudlet > "$D/mudlet.nm" 2>/dev/null || true
        grep -iE 'mismatch|profile' "${RUNNER_TEMP}/use-build.log" | head -400 > "$D/use-build-profile-warnings.txt" || true
        cp "${RUNNER_TEMP}/ctest.log" "$D/" 2>/dev/null || true
        ls -la $B/pgo-profile/ | head -5 > "$D/pgo-profile-ls.txt" 2>/dev/null || true
        find $B/pgo-profile -name '*.gcda' | wc -l >> "$D/pgo-profile-ls.txt" 2>/dev/null || true
        cp $B/pgo-profile/training-*.log "$D/" 2>/dev/null || true

    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: diag-${{ matrix.v.name }}
        path: ${{ runner.temp }}/diag
        retention-days: 7

    # we need to be in the right place for LuaGlobals.lua to load
    - name: (Linux) Prep binary for running tests
      if: matrix.v.tests == 'true' && runner.os =='Linux'
      run: cp ${{runner.workspace}}/b/ninja/src/mudlet ${{github.workspace}}/src

    - name: (Linux/macOS) Start fixture HTTP server for Lua tests
      if: matrix.v.tests == 'true'
      shell: bash
      run: |
        port_file="${{runner.temp}}/mudlet-http-fixture-port"
        rm -f "${port_file}"
        MUDLET_TEST_HTTP_PORT_FILE="${port_file}" nohup python3 "${{github.workspace}}/CI/http-fixture-server.py" > "${{runner.temp}}/http-fixture-server.log" 2>&1 &
        for _ in $(seq 1 50); do
          [ -s "${port_file}" ] && break
          sleep 0.1
        done
        if [ ! -s "${port_file}" ]; then
          echo "fixture HTTP server failed to start" >&2
          cat "${{runner.temp}}/http-fixture-server.log" 2>/dev/null || true
          exit 1
        fi
        port="$(cat "${port_file}")"
        if ! curl -fsS "http://127.0.0.1:${port}/fixture.txt" > /dev/null; then
          echo "fixture HTTP server is not serving fixtures" >&2
          cat "${{runner.temp}}/http-fixture-server.log" 2>/dev/null || true
          exit 1
        fi
        echo "MUDLET_TEST_HTTP_PORT=${port}" >> "${GITHUB_ENV}"
        echo "fixture HTTP server ready on 127.0.0.1:${port}"

    - name: (Linux) Start fake Discord IPC server for Lua tests
      if: matrix.v.tests == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        # A short runtime directory of its own: the whole discord-ipc-0 socket
        # path has to fit into sockaddr_un's 108 character sun_path, and
        # runner.temp does not leave room for it.
        runtime_dir="$(mktemp -d /tmp/mdxdg-XXXX)"
        ready_file="${{runner.temp}}/mudlet-discord-fixture-ready"
        rm -f "${ready_file}"
        nohup python3 "${{github.workspace}}/CI/discord-ipc-fixture.py" \
          --runtime-dir "${runtime_dir}" \
          --capture-file "${{runner.temp}}/mudlet-discord-frames.jsonl" \
          --ready-file "${ready_file}" > "${{runner.temp}}/discord-ipc-fixture.log" 2>&1 &
        for _ in $(seq 1 50); do
          [ -s "${ready_file}" ] && break
          sleep 0.1
        done
        if [ ! -s "${ready_file}" ] || [ ! -S "${runtime_dir}/discord-ipc-0" ]; then
          echo "fake Discord IPC server failed to start" >&2
          cat "${{runner.temp}}/discord-ipc-fixture.log" 2>/dev/null || true
          exit 1
        fi
        cat "${ready_file}" >> "${GITHUB_ENV}"
        # Prepended rather than replacing: the Qt install action puts Qt's own
        # libraries on this path.
        echo "MUDLET_TEST_DISCORD_LIB_PATH=${{github.workspace}}/3rdparty/discord/rpc/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "${GITHUB_ENV}"
        echo "fake Discord IPC server ready in ${runtime_dir}"

    - name: (Linux/macOS) Start telnet fixture for Lua tests
      if: matrix.v.tests == 'true'
      shell: bash
      run: |
        telnet_dir="${{runner.temp}}/mudlet-telnet-fixture"
        rm -rf "${telnet_dir}"
        mkdir -p "${telnet_dir}"
        MUDLET_TEST_TELNET_DIR="${telnet_dir}" nohup python3 "${{github.workspace}}/CI/telnet-fixture-server.py" > "${{runner.temp}}/telnet-fixture.log" 2>&1 &
        for _ in $(seq 1 50); do
          [ -s "${telnet_dir}/port" ] && break
          sleep 0.1
        done
        if [ ! -s "${telnet_dir}/port" ]; then
          echo "telnet fixture failed to start" >&2
          cat "${{runner.temp}}/telnet-fixture.log" 2>/dev/null || true
          exit 1
        fi
        echo "MUDLET_TEST_TELNET_DIR=${telnet_dir}" >> "${GITHUB_ENV}"
        echo "telnet fixture ready on port $(cat "${telnet_dir}/port")"

    - name: (Linux/macOS) Start MMCP peer fixture for Lua tests
      if: matrix.v.tests == 'true'
      shell: bash
      run: |
        peer_dir="${{runner.temp}}/mudlet-mmcp-peer"
        rm -rf "${peer_dir}"
        mkdir -p "${peer_dir}"
        MUDLET_TEST_MMCP_DIR="${peer_dir}" nohup python3 "${{github.workspace}}/CI/mmcp-peer.py" > "${{runner.temp}}/mmcp-peer.log" 2>&1 &
        for _ in $(seq 1 50); do
          [ -s "${peer_dir}/port" ] && break
          sleep 0.1
        done
        if [ ! -s "${peer_dir}/port" ]; then
          echo "MMCP peer fixture failed to start" >&2
          cat "${{runner.temp}}/mmcp-peer.log" 2>/dev/null || true
          exit 1
        fi
        port="$(cat "${peer_dir}/port")"
        if ! python3 -c "import socket, sys; socket.create_connection(('127.0.0.1', int(sys.argv[1])), 5).close()" "${port}"; then
          echo "MMCP peer fixture is not accepting connections" >&2
          cat "${{runner.temp}}/mmcp-peer.log" 2>/dev/null || true
          exit 1
        fi
        echo "MUDLET_TEST_MMCP_DIR=${peer_dir}" >> "${GITHUB_ENV}"
        echo "MMCP peer fixture ready on 127.0.0.1:$(cat "${peer_dir}/port")"

    - name: (Linux) Run Lua tests
      if: matrix.v.tests == 'true' && runner.os == 'Linux'
      continue-on-error: true
      # This leg drives the real discord-rpc library, whose reconnects happen in
      # wall-clock time, so the suite needs a budget of its own: the run itself
      # takes 480-730s under ASan, and the rest is headroom for a slow runner.
      timeout-minutes: 20
      run: xvfb-run --auto-servernum ${{github.workspace}}/src/mudlet --profile "Mudlet self-test" --mirror --offline
      env:
        AUTORUN_BUSTED_TESTS: 'true'
        # Off by default; the flood specs pend without it
        MUDLET_MATCH_THREADS: 2
        # Its statistics sample would take lines the flood specs compare off the pool
        MUDLET_MATCH_SAMPLE_EVERY: 0
        MUDLET_TEST_MODE: 1
        MUDLET_TEST_REQUIRE_TTS_MOCK: 1
        MUDLET_TEST_REQUIRE_HTTP_FIXTURE: 1
        MUDLET_TEST_REQUIRE_MMCP_PEER: 1
        MUDLET_TEST_REQUIRE_TELNET_FIXTURE: 1
        # Qt Multimedia runs a player here even without an audio device, so a
        # media effect spec that cannot play is a regression rather than an
        # environment quirk. macOS runners start no player at all, so the gate
        # stays off there.
        MUDLET_TEST_REQUIRE_MEDIA: 1
        # Xvfb has no window manager to overrule a resize request, so the main
        # window here follows setMainWindowSize exactly and one that stops
        # following it is a regression rather than an environment quirk. The
        # macOS runners are not gated: their window server can refuse a resize.
        MUDLET_TEST_REQUIRE_WINDOW_RESIZE: 1
        # The fake Discord IPC server's socket lives in this runtime directory,
        # and the bundled discord-rpc library is only reachable through this
        # library path - without both the Discord specs have nothing to talk to.
        MUDLET_TEST_REQUIRE_DISCORD: 1
        XDG_RUNTIME_DIR: ${{env.MUDLET_TEST_DISCORD_RUNTIME_DIR}}
        LD_LIBRARY_PATH: ${{env.MUDLET_TEST_DISCORD_LIB_PATH}}
        # The session bus socket lives in the runtime directory replaced above,
        # so Qt's D-Bus platform theme can no longer find it and would fall back
        # to spawning dbus-launch. Point it at nothing instead: libdbus leaks
        # the buffer it reads the autolaunch reply into (1032 bytes, reported
        # against this job by LeakSanitizer with no Mudlet frames in the stack),
        # and no spec needs a session bus.
        DBUS_SESSION_BUS_ADDRESS: 'disabled:'
        TESTS_DIRECTORY: ${{github.workspace}}/src/mudlet-lua/tests
        QUIT_MUDLET_AFTER_TESTS: 'true'
        # intercept_tls_get_addr=0 keeps gcc-10's sanitizer runtime from
        # recording a bogus dynamic-TLS range for LeakSanitizer's tracer to crash
        # on (#9809); test/functional_tests/CMakeLists.txt explains it in full
        ASAN_OPTIONS: ${{ false && 'detect_leaks=1:intercept_tls_get_addr=0' || '' }}
        # log_threads is insurance rather than an expectation: if the flag above
        # ever proves incomplete, it names the stack and TLS range of every
        # thread the tracer walks, so the last one printed before a crash is the
        # range it died on (#9809). Seven lines a run, and the only way to see
        # that from CI.
        LSAN_OPTIONS: ${{ false && format('suppressions={0}/asan-suppressions.txt:exitcode=1:log_threads=1', github.workspace) || '' }}

    - name: (Linux) Show the captured Discord frames on failure
      if: failure() && matrix.v.tests == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        echo "--- fake Discord IPC server log ---"
        cat "${{runner.temp}}/discord-ipc-fixture.log" 2>/dev/null || true
        echo "--- frames it captured ---"
        cat "${{runner.temp}}/mudlet-discord-frames.jsonl" 2>/dev/null || true

    - name: (Linux/macOS) Show the telnet fixture log on failure
      if: failure() && matrix.v.tests == 'true'
      shell: bash
      run: |
        echo "--- telnet fixture log ---"
        cat "${{runner.temp}}/telnet-fixture.log" 2>/dev/null || true
        echo "--- what it captured ---"
        cat "${{runner.temp}}/mudlet-telnet-fixture/capture.json" 2>/dev/null || true

    - name: Passed Lua tests
      if: matrix.v.tests == 'true'
      continue-on-error: true
      run: |
        if [ -e /tmp/busted-tests-failed ]
        then
          echo "Lua tests failed - see the action called 'Run Lua tests' above for detailed output."
