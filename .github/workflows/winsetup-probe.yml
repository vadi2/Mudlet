# THROWAWAY probe - never for upstream
name: winsetup probe
on:
  push:
    branches: [ci-winsetup-probe]
jobs:
  seed:
    name: winsetup pkgcache seed
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7
    - id: msys
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        update: true
    - name: setup sdk
      shell: msys2 {0}
      run: |
        s=$(date +%s)
        $GITHUB_WORKSPACE/CI/setup-windows-sdk.sh > /dev/null 2>&1
        echo "TOTAL $(( $(date +%s) - s ))s"; du -sh /var/cache/pacman/pkg
    - uses: actions/cache/save@v6
      with:
        path: ${{ steps.msys.outputs.msys2-location }}\var\cache\pacman\pkg
        key: probe-msys2-clang64-pkgs-${{ github.run_id }}
  hit:
    name: winsetup pkgcache hit ${{matrix.rep}}
    needs: seed
    runs-on: windows-2022
    strategy:
      matrix:
        rep: [1, 2]
    steps:
    - uses: actions/checkout@v7
    - id: msys
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        update: true
    - uses: actions/cache/restore@v6
      with:
        path: ${{ steps.msys.outputs.msys2-location }}\var\cache\pacman\pkg
        key: probe-msys2-clang64-pkgs-${{ github.run_id }}
    - name: setup sdk
      shell: msys2 {0}
      run: |
        s=$(date +%s)
        $GITHUB_WORKSPACE/CI/setup-windows-sdk.sh 2>&1 | while IFS= read -r l; do printf '%s %s\n' "$(( $(date +%s) - s ))" "$l"; done | grep -E 'Retrieving packages|Processing package changes|post-transaction|Checking, and installing|luarocks installation completed|Total Download'
        echo "TOTAL $(( $(date +%s) - s ))s"
